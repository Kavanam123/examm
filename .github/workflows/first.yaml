name: CI
on : [push]


jobs:
  run-shell-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Print a string
        run: echo "hello world"
      - name: parameters
        run: echo "hello hi,file=index.html,miss"
      - name: Group of logs
        run: |
          echo "::group::my group title"
          echo "Inside the group"
          echo "::end::"
      - name: Masking a value
        run: "::add-mask::Secret String"
      - name: Echo a secret
        run: Echo "Secret String"
